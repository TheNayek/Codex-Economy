name: Offline checks
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check public contents
        run: python build_public.py --check
      - name: Build public distribution
        run: python build_public.py --output dist/ci
      - name: Test exported source
        working-directory: dist/ci
        run: python -m unittest discover -s tests -v
      - name: Exercise reversible installation
        working-directory: dist/ci
        run: python economy.py self-test
      - name: Validate public distribution can reproduce itself
        working-directory: dist/ci
        run: python build_public.py --check
